[workspace]
resolver = "2"
members = ["crates/vaultly-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
debug = false

[profile.dev]
opt-level = 0
debug = 1
